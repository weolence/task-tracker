syntax = "proto3";

package userv1;

option go_package = "auth-service/api/proto/userv1";

message User {
  int32 id = 1;
  string email = 2;
  string name = 3;
  string surname = 4;
  string role = 5;
  // password is not included for security
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string surname = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  int32 user_id = 1;
  string role = 2;
}

message GetUserRequest {
  optional int32 user_id = 1;
  optional string email = 2;
}

message UpdateUserRequest {
  User user = 1;
  optional string password = 2;
}

message DeleteUserRequest {
  int32 user_id = 1;
}

message OperationResponse {
  string message = 1;
}
