services:
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-migrate:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile.migrate
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth_db?sslmode=disable

  auth-service:
    build:
      context: .
      dockerfile: backend/auth-service/Dockerfile
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      auth-db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/auth_db?sslmode=disable
      JWT_SECRET: supersecret123
      PROJECT_SERVICE_URL: http://project-service:8081
      PORT: "8080"
    ports:
      - "8080:8080"

  project-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_db
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: .
      dockerfile: backend/project-service/Dockerfile
    restart: unless-stopped
    depends_on:
      project-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:postgres@project-db:5432/project_db?sslmode=disable
      JWT_SECRET: supersecret123
      AUTH_SERVICE_URL: http://auth-service:8080
      PORT: "8081"
    ports:
      - "8081:8081"

  api-gateway:
    build:
      context: .
      dockerfile: backend/api-gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_started
      project-service:
        condition: service_started
    environment:
      AUTH_SERVICE_GRPC_ADDR: "auth-service:9090"
      PROJECT_SERVICE_GRPC_ADDR: "project-service:9091"
    ports:
      - "8000:8000"

  seed:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install --silent && node e2e-tests/scripts/seed.js"
    depends_on:
      api-gateway:
        condition: service_started
      auth-db:
        condition: service_healthy
    environment:
      API_URL: http://api-gateway:8000
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: "5432"
      AUTH_DB_NAME: auth_db
      AUTH_DB_USER: postgres
      AUTH_DB_PASS: postgres
    restart: "no"
